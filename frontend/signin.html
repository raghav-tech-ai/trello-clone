<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign In - Taskora</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f3f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .card {
        background: white;
        width: 360px;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .logo {
        display: block;
        margin: 0 auto 15px auto;
    }

    .heading {
        text-align: center;
        margin: 0 0 5px 0;
        color: #0F172A;
    }

    .tagline {
        text-align: center;
        color: #666;
        font-size: 13px;
        margin: 0 0 10px 0;
    }

    .subtext {
        text-align: center;
        color: #666;
        font-size: 13px;
        margin-bottom: 25px;
    }

    .field {
        margin-bottom: 15px;
    }

    .field-label-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 5px;
    }

    .field label {
        font-size: 13px;
        font-weight: bold;
        color: #0F172A;
    }

    .forgot-link {
        font-size: 12px;
        color: #E05A47;
        text-decoration: none;
    }

    .field input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: #f0eff5;
        font-size: 14px;
        box-sizing: border-box;
    }

    .remember-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #0F172A;
        margin-bottom: 15px;
    }

    .signin-btn {
        width: 100%;
        padding: 12px;
        background: #E05A47;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }

    .divider {
        text-align: center;
        color: #999;
        font-size: 12px;
        margin: 20px 0;
    }

    .footer-text {
        text-align: center;
        font-size: 13px;
        color: #666;
    }

    .footer-text a {
        color: #E05A47;
        font-weight: bold;
        text-decoration: none;
    }
</style>
</head>
<body>

    <div class="card">
        <img src="assets/logo.svg" class="logo" height="44">

        <h1 class="heading">Taskora</h1>
        <p class="tagline">Plan work. Move faster.</p>
        <p class="subtext">Sign in to access your organizations and project boards.</p>

        <form id="signin-form">
            <div class="field">
                <div class="field-label-row">
                    <label for="username">Username</label>
                </div>
                <input type="text" id="username" placeholder="alexchen">
            </div>

            <div class="field">
                <div class="field-label-row">
                    <label for="password">Password</label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                <input type="password" id="password" placeholder="Enter password">
            </div>

            <div class="remember-row">
                <input type="checkbox" id="remember">
                <label for="remember">Stay signed in</label>
            </div>

            <button type="submit" class="signin-btn" id="signin-btn">Sign in to Taskora</button>
        </form>

        <p class="divider">OR</p>

        <p class="footer-text">Don't have an account? <a href="signup.html">Create an account (Sign up)</a></p>
    </div>

</body>
</html>
