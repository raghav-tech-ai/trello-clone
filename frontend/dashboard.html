<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - Taskora</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f3f6;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 15px 30px;
            border-bottom: 1px solid #e3e2e8;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-left .heading {
            margin: 0;
            color: #0F172A;
            font-size: 18px;
        }

        .user-circle {
            width: 34px;
            height: 34px;
            background: #E05A47;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
        }

        .main {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-heading {
            color: #0F172A;
            margin: 0 0 5px 0;
        }

        .page-subtext {
            color: #666;
            font-size: 14px;
            margin: 0 0 25px 0;
        }

        .org-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .org-card {
            background: white;
            border: 1px solid #e3e2e8;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
        }

        .org-title {
            margin: 0 0 5px 0;
            color: #0F172A;
            font-size: 16px;
        }

        .org-description {
            color: #666;
            font-size: 13px;
            margin: 0 0 12px 0;
        }

        .role-badge {
            display: inline-block;
            font-size: 12px;
            padding: 3px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            color: #0F172A;
        }

        .new-org-card {
            background: white;
            border: 1px dashed #ccc;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #E05A47;
            font-weight: bold;
            cursor: pointer;
            min-height: 80px;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="navbar-left">
            <img src="assets/logo.svg" height="28">
            <h3 class="heading">Taskora</h3>
        </div>
        <div class="user-circle" id="user-initials">AC</div>
    </nav>

    <main class="main">
        <h1 class="page-heading">Your Organizations</h1>
        <p class="page-subtext">Select an organization to view its boards, or create a new one.</p>

        <div class="org-grid" id="org-list">
            <div class="org-card">
                <h3 class="org-title">Acme Corp</h3>
                <p class="org-description">Product and engineering team workspace</p>
                <span class="role-badge">Admin</span>
            </div>

            <div class="org-card">
                <h3 class="org-title">Design Guild</h3>
                <p class="org-description">Shared design and marketing boards</p>
                <span class="role-badge">Member</span>
            </div>

            <div class="new-org-card" id="create-org-btn">+ New Organization</div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.2/axios.min.js"></script>
    <script src="js/api.js"></script>

</body>

</html>
