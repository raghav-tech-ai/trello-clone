<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Board - Taskora</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f3f6;
    }

    .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: white;
        padding: 15px 30px;
        border-bottom: 1px solid #e3e2e8;
    }

    .navbar-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .navbar-left .heading {
        margin: 0;
        color: #0F172A;
        font-size: 18px;
    }

    .breadcrumb {
        font-size: 13px;
        color: #666;
    }

    .breadcrumb a {
        color: #666;
        text-decoration: none;
    }

    .user-circle {
        width: 34px;
        height: 34px;
        background: #E05A47;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: bold;
    }

    .main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 30px 20px;
    }

    .board-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
    }

    .page-heading {
        color: #0F172A;
        margin: 0;
    }

    .delete-board-btn {
        font-size: 13px;
        color: #b5432f;
        background: none;
        border: 1px solid #e3c9c5;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
    }

    .board-columns {
        display: flex;
        gap: 20px;
        overflow-x: auto;
    }

    .column {
        background: #eceaf1;
        border: 1px solid #e3e2e8;
        border-radius: 8px;
        padding: 15px;
        width: 280px;
        flex-shrink: 0;
    }

    .column-title {
        font-size: 14px;
        font-weight: bold;
        color: #0F172A;
        margin: 0 0 15px 0;
    }

    .issue-card {
        background: white;
        border: 1px solid #e3e2e8;
        border-radius: 6px;
        padding: 12px;
        margin-bottom: 10px;
        font-size: 13px;
        color: #0F172A;
        cursor: pointer;
    }

    .add-issue-link {
        font-size: 13px;
        color: #E05A47;
        font-weight: bold;
        cursor: pointer;
        display: inline-block;
        margin-top: 5px;
    }
</style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-left">
            <img src="assets/logo.svg" height="28">
            <h3 class="heading">Taskora</h3>
            <span class="breadcrumb"><a href="dashboard.html">Dashboard</a> / <a href="organization.html">Acme Corp</a> / Sprint Board</span>
        </div>
        <div class="user-circle">AC</div>
    </nav>

    <main class="main">
        <div class="board-header">
            <h1 class="page-heading">Sprint Board</h1>
            <button class="delete-board-btn" id="delete-board-btn">Delete Board</button>
        </div>

        <div class="board-columns">
            <div class="column">
                <p class="column-title">To Do</p>
                <div class="issue-list" id="todo-list">
                    <div class="issue-card">Fix login redirect bug</div>
                    <div class="issue-card">Write API docs</div>
                </div>
                <div class="add-issue-link" id="add-issue-todo">+ Add issue</div>
            </div>

            <div class="column">
                <p class="column-title">In Progress</p>
                <div class="issue-list" id="inprogress-list">
                    <div class="issue-card">Set up MongoDB models</div>
                </div>
                <div class="add-issue-link" id="add-issue-inprogress">+ Add issue</div>
            </div>

            <div class="column">
                <p class="column-title">Done</p>
                <div class="issue-list" id="done-list">
                    <div class="issue-card">Project repo setup</div>
                    <div class="issue-card">Signup/signin routes</div>
                </div>
                <div class="add-issue-link" id="add-issue-done">+ Add issue</div>
            </div>
        </div>
    </main>

</body>
</html>
